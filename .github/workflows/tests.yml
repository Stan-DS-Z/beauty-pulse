name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite reads the shipped public DB. It is tracked gzipped because
      # the raw file is over GitHub's 100 MB limit; conftest extracts it, but
      # doing it here keeps the failure legible if the archive is ever missing.
      - name: Check the public DB archive is present
        run: test -f dashboard/assets/signal_pulse_public.db.gz

      - name: Run tests
        run: pytest
